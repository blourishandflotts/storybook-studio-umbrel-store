version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: storybook-studio_server_1
      APP_PORT: 8080
  server:
    image: ghcr.io/blourishandflotts/storybook-studio:sha-8d94a878768dbc6c0c390a3297731010efa28dec
    restart: on-failure
    init: true
    stop_grace_period: 1m
    environment:
      STORYBOOK_DATA: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
