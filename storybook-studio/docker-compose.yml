version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: storybook-studio_server_1
      APP_PORT: 8080
  server:
    image: ghcr.io/blourishandflotts/storybook-studio:sha-a1b01ee5b5001203eca493b219bc61a8cb65a9be
    restart: on-failure
    init: true
    stop_grace_period: 1m
    environment:
      STORYBOOK_DATA: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
