name: Generate Umbrel PNG icon
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render icon PNG
        run: |
          python -m pip install cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='storybook-studio/icon.svg', write_to='storybook-studio/icon.png', output_width=256, output_height=256)
          PY
      - name: Commit generated icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storybook-studio/icon.png
          git diff --cached --quiet || (git commit -m "Add Umbrel-compatible PNG app icon" && git push)
